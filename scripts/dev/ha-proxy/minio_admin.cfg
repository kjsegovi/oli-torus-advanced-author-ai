global
    daemon
    maxconn 100

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend minio-admin
    bind *:9001
    default_backend minio-console

backend minio-console
    server minio minio:9001 check resolvers docker init-addr libc,none
