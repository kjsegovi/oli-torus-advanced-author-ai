global
    daemon
    maxconn 3000

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend http-in
    bind *:80
    bind *:443 ssl crt __TLS_CERT_BUNDLE__
    http-request redirect scheme https unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    acl simulation_host hdr(host) -i __SIMULATION_HOST__ __SIMULATION_HOST__:443
    acl simulation_method method GET HEAD
    acl simulation_v1 path_beg __SIMULATION_BASE_PATH__/generated-simulations/artifacts/
    acl simulation_v2 path_beg __SIMULATION_BASE_PATH__/generated-simulations/storage-v2/
    acl simulation_bucket_general_path path_beg /buckets/__SIMULATION_BUCKET__

    http-request deny deny_status 405 if simulation_host !simulation_method
    http-request deny deny_status 404 if simulation_host !simulation_v1 !simulation_v2
    http-request deny deny_status 404 if !simulation_host simulation_bucket_general_path

    acl s3_path path_beg /super_media/
    acl super_s3_path path_beg /superactivity/
    acl minio_api_path path_beg /buckets/
    acl is_css path_end .css

    use_backend simulation_v2 if simulation_host simulation_v2
    use_backend simulation_v1 if simulation_host simulation_v1
    use_backend s3_css if s3_path is_css
    use_backend s3 if s3_path
    use_backend super_s3 if super_s3_path
    use_backend minio_api if minio_api_path

    default_backend torus

backend torus
    server torus1 __TORUS_BACKEND_HOST__:__TORUS_BACKEND_PORT__ check resolvers docker init-addr libc,none

backend simulation_v1
    http-request set-path /__LEGACY_MEDIA_BUCKET__%[path,regsub(^__SIMULATION_BASE_PATH__,,)]
    http-request del-header Authorization
    http-request del-header Cookie
    http-response del-header Set-Cookie
    http-response set-header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; worker-src 'none'; frame-ancestors 'self' __FRAME_ANCESTORS__"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()"
    http-response set-header Cache-Control "public, max-age=31536000, immutable"
    server minio __MINIO_API_HOST__:__MINIO_API_PORT__ check resolvers docker init-addr libc,none

backend simulation_v2
    http-request set-path /__SIMULATION_BUCKET__%[path,regsub(^__SIMULATION_BASE_PATH__,,)]
    http-request del-header Authorization
    http-request del-header Cookie
    http-response del-header Set-Cookie
    http-response set-header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; worker-src 'none'; frame-ancestors 'self' __FRAME_ANCESTORS__"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()"
    http-response set-header Cache-Control "public, max-age=31536000, immutable"
    server minio __MINIO_API_HOST__:__MINIO_API_PORT__ check resolvers docker init-addr libc,none

backend s3
    http-request set-path %[path,regsub(^/super_media,/__LEGACY_MEDIA_BUCKET__/media,)]
    http-request del-header Authorization
    server minio __MINIO_API_HOST__:__MINIO_API_PORT__ check resolvers docker init-addr libc,none

backend s3_css
    http-request set-path %[path,regsub(^/super_media,/__LEGACY_MEDIA_BUCKET__/media,)]
    http-request del-header Authorization
    http-response set-header Content-Type text/css
    server minio __MINIO_API_HOST__:__MINIO_API_PORT__ check resolvers docker init-addr libc,none

backend super_s3
    http-request set-path /__LEGACY_MEDIA_BUCKET__%[path]
    http-request del-header Authorization
    server minio __MINIO_API_HOST__:__MINIO_API_PORT__ check resolvers docker init-addr libc,none

backend minio_api
    http-request set-path %[path,regsub(^/buckets,,)]
    server minio __MINIO_API_HOST__:__MINIO_API_PORT__ check resolvers docker init-addr libc,none
